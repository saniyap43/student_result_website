services:
  - type: web
    name: faizan-ummul-khair-results
    runtime: node
    plan: free
    buildCommand: npm ci && node --check server.js && node --check db.js && node --check scripts/migrate-sqlite-to-postgres.js
    startCommand: npm start
    healthCheckPath: /api/site
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
